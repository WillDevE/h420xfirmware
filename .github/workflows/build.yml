name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Arm GNU Toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://developer.arm.com/-/media/Files/downloads/gnu/12.2.mpacbti-rel1/binrel/arm-gnu-toolchain-12.2.mpacbti-rel1-mingw-w64-i686-arm-none-eabi.zip'
          $want = '9f5f5492447212001aa8b708e237cdfecb1296ba0f1c699e2aa2fd87249e5b00'
          $zip = Join-Path $env:RUNNER_TEMP 'arm-toolchain.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'arm-toolchain'
          curl.exe -L --fail --silent --show-error -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Arm toolchain download failed' }
          $got = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "Arm toolchain SHA-256 mismatch: $got" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $bin = Join-Path $dir 'bin'
          if (-not (Test-Path (Join-Path $bin 'arm-none-eabi-gcc.exe'))) {
            $top = Get-ChildItem $dir -Directory | Select-Object -First 1
            $bin = Join-Path $top.FullName 'bin'
          }
          if (-not (Test-Path (Join-Path $bin 'arm-none-eabi-gcc.exe'))) { throw 'Arm toolchain bin directory not found' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'arm-none-eabi-gcc.exe') --version

      - name: Build rhythm1000
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./firmware/build.ps1 -Clean -Profile rhythm900 -Robust -EdgeExt -Scan1kModes -AxisGapModes -LoopMode 1 -LoopArm -Release -CadReset 256 -ReadGap 50 -StockIdentity -SerialNumber 20210233 -LateConnect -QuietHeartbeat -FastEp1 -R63Modes -NoR55Aux

      - name: Verify image (96 checks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $elf = Get-ChildItem firmware/build/*.elf | Select-Object -First 1
          $app = Get-ChildItem firmware/build/*_app.bin | Select-Object -First 1
          if (-not $elf -or -not $app) { throw 'Build outputs not found' }
          python firmware/tools/verify_image.py --elf $elf.FullName --bin $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'verify_image.py failed' }

      - name: Stage image and check the tested hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $want = '7543ef7d1eb68658e2959ca1c966f1ad8d11402f9e4d5985d55c9740bebd51a5'
          $app = Get-ChildItem firmware/build/*_app.bin | Select-Object -First 1
          if (-not $app) { throw 'Build output not found' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $app.FullName).Hash.ToLowerInvariant()
          if ($hash -ne $want) { throw "Built rhythm1000.bin SHA-256 $hash does not match the tested image $want" }
          Copy-Item $app.FullName rhythm1000.bin

      - name: Build flasher package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'H420X-Flasher'
          New-Item -ItemType Directory -Force -Path $stage, "$stage\firmware", "$stage\gigadevice" | Out-Null
          Copy-Item -Path flash.bat, flash.ps1, LICENSE, NOTICE.md -Destination $stage
          Copy-Item -Path rhythm1000.bin -Destination (Join-Path $stage 'firmware\rhythm1000.bin')
          Copy-Item -Path .github/release/README.txt -Destination (Join-Path $stage 'README.txt')
          Copy-Item -Path .github/release/gigadevice-readme.txt -Destination (Join-Path $stage 'gigadevice\README.txt')

          $ref = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA }
          @(
            'Source code for this build:',
            "https://github.com/WillDevE/h420xfirmware/tree/$ref/firmware",
            '',
            'That tree is the exact source used by the GitHub Actions workflow.',
            'The release page also has auto-generated source code zip/tar.gz files.',
            '',
            'License: GPL-3.0-or-later (see LICENSE). TinyUSB: MIT (see NOTICE.md).'
          ) | Out-File -Encoding ascii (Join-Path $stage 'SOURCE.txt')

          $pairs = @(
            @('firmware\rhythm1000.bin', 'rhythm1000.bin'),
            @('flash.ps1', 'flash.ps1'),
            @('flash.bat', 'flash.bat'),
            @('README.txt', 'README.txt'),
            @('SOURCE.txt', 'SOURCE.txt'),
            @('LICENSE', 'LICENSE'),
            @('NOTICE.md', 'NOTICE.md'),
            @('gigadevice\README.txt', 'gigadevice/README.txt')
          )
          $sums = foreach ($pair in $pairs) {
            $fileHash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $stage $pair[0])).Hash.ToLowerInvariant()
            "$fileHash  $($pair[1])"
          }
          $sums | Out-File -Encoding ascii (Join-Path $stage 'SHA256SUMS.txt')

          Compress-Archive -Path $stage -DestinationPath 'H420X-Flasher.zip' -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'H420X-Flasher.zip'))
          $zip.Entries | Select-Object -ExpandProperty FullName
          $zip.Dispose()
          Write-Host "ZIP SHA-256: $((Get-FileHash -Algorithm SHA256 -Path 'H420X-Flasher.zip').Hash.ToLowerInvariant())"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: |
            rhythm1000.bin
            H420X-Flasher.zip

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $imageHash = (Get-FileHash -Algorithm SHA256 -Path 'rhythm1000.bin').Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path 'H420X-Flasher.zip').Hash.ToLowerInvariant()
          $notes = @(
            'Final 1000 Hz cursor-only firmware for the Huion H420X.',
            '',
            '**Download `H420X-Flasher.zip`.** It has the flasher and the firmware image inside; see the README for the steps.',
            '',
            'v2.0.1 removes the bands that circles showed at every Y coil boundary and hands over to the next coil where the two coils read equal. Nothing in the image adapts: the same coil readings always give the same position.',
            '',
            '- 999.9 Hz on the test bench, with no dropped reports and no report gaps over 1.5 ms (v2.0.1: about 50,000 reports in circles; v2.0.0, same reads: about 214,000).',
            '- Steady jitter over 9 tablet positions: X 1.82 / Y 2.28 units RMS (1 unit is about 0.005 mm), measured on v2.0.0, which uses the same reads.',
            '- Known limit: a small step (about 0.2 mm) remains at each X coil boundary; see Limits and TODO in the README.',
            '- Raw same-frame position: no filtering, smoothing or added delay. No pressure, tip or pen buttons.',
            '',
            "``rhythm1000.bin`` SHA-256: ``$imageHash``",
            "``H420X-Flasher.zip`` SHA-256: ``$zipHash``",
            '',
            'Built by GitHub Actions from the source in this repository. Older releases are kept as Legacy.'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          $notes | Out-File -Encoding utf8 $notesFile
          gh release create $tag H420X-Flasher.zip --verify-tag --latest --title "H420X clean-room firmware $tag (1000 Hz)" --notes-file $notesFile 2>$null
          gh release upload $tag H420X-Flasher.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          gh release edit $tag --latest --title "H420X clean-room firmware $tag (1000 Hz)" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }

      - name: Mark older releases as legacy (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = @(
            @{ Tag = 'v2.0.0'; Keep = 'H420X-Flasher.zip' },
            @{ Tag = 'v1.0.3'; Keep = 'H420X-Flasher-v1.0.3.zip' },
            @{ Tag = 'v1.0.2'; Keep = 'H420X-Flasher-v1.0.2.zip' },
            @{ Tag = 'v1.0.1'; Keep = 'H420X-Flasher-v1.0.1.zip' },
            @{ Tag = 'v1.0.0'; Keep = 'rhythm1000.bin' }
          )
          # Check every release first, so a surprise stops the step before anything is deleted.
          foreach ($item in $legacy) {
            $json = gh release view $item.Tag --json assets
            if ($LASTEXITCODE -ne 0) { throw "Cannot read release $($item.Tag)" }
            $names = @(($json | ConvertFrom-Json).assets | ForEach-Object { $_.name })
            if ($names -notcontains $item.Keep) { throw "$($item.Tag) has no $($item.Keep); nothing was deleted" }
            $item.Names = $names
          }
          $notice = '> **Legacy release, not recommended.** Superseded by the [latest release](https://github.com/WillDevE/h420xfirmware/releases/latest). Only its main download is kept here; other files mentioned below were removed to reduce clutter.'
          foreach ($item in $legacy) {
            foreach ($asset in $item.Names) {
              if ($asset -ne $item.Keep) {
                gh release delete-asset $item.Tag $asset --yes
                if ($LASTEXITCODE -ne 0) { throw "Could not delete $asset from $($item.Tag)" }
              }
            }
            $json = gh release view $item.Tag --json body
            if ($LASTEXITCODE -ne 0) { throw "Cannot read release $($item.Tag)" }
            $body = "$(($json | ConvertFrom-Json).body)"
            if (-not $body.StartsWith('> **Legacy release')) { $body = "$notice`n`n$body" }
            $notesFile = Join-Path $env:RUNNER_TEMP "legacy-$($item.Tag).md"
            Set-Content -Encoding utf8 -Path $notesFile -Value $body
            gh release edit $item.Tag --latest=false --title "[Legacy] H420X clean-room firmware $($item.Tag)" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Could not mark $($item.Tag) as legacy" }
          }
