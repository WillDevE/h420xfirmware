name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Arm GNU Toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://developer.arm.com/-/media/Files/downloads/gnu/12.2.mpacbti-rel1/binrel/arm-gnu-toolchain-12.2.mpacbti-rel1-mingw-w64-i686-arm-none-eabi.zip'
          $want = '9f5f5492447212001aa8b708e237cdfecb1296ba0f1c699e2aa2fd87249e5b00'
          $zip = Join-Path $env:RUNNER_TEMP 'arm-toolchain.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'arm-toolchain'
          curl.exe -L --fail --silent --show-error -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Arm toolchain download failed' }
          $got = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "Arm toolchain SHA-256 mismatch: $got" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $bin = Join-Path $dir 'bin'
          if (-not (Test-Path (Join-Path $bin 'arm-none-eabi-gcc.exe'))) {
            $top = Get-ChildItem $dir -Directory | Select-Object -First 1
            $bin = Join-Path $top.FullName 'bin'
          }
          if (-not (Test-Path (Join-Path $bin 'arm-none-eabi-gcc.exe'))) { throw 'Arm toolchain bin directory not found' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'arm-none-eabi-gcc.exe') --version

      - name: Build rhythm1000 (stable)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./firmware/build.ps1 -Profile rhythm900 -Robust -EdgeExt -SamptModes -LoopMode 3 -LoopArm -Release -CadReset 256 -StockIdentity -SerialNumber 20210233 -LateConnect -QuietHeartbeat -Clean

      - name: Build rhythm1015-wip (WIP)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./firmware-wip/build.ps1 -Clean -Profile rhythm900 -Robust -EdgeExt -Scan1kModes -AxisGapModes -LoopMode 1 -LoopArm -Release -CadReset 256 -FrameFloorUs 985 -ReadGap 50 -StockIdentity -SerialNumber 20210233 -LateConnect -QuietHeartbeat

      - name: Verify image (96 checks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $elf = Get-ChildItem firmware/build/*.elf | Select-Object -First 1
          $app = Get-ChildItem firmware/build/*_app.bin | Select-Object -First 1
          if (-not $elf -or -not $app) { throw 'Build outputs not found' }
          python firmware/tools/verify_image.py --elf $elf.FullName --bin $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'verify_image.py failed' }

      - name: Verify WIP image (96 checks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $elf = Get-ChildItem firmware-wip/build/*.elf | Select-Object -First 1
          $app = Get-ChildItem firmware-wip/build/*_app.bin | Select-Object -First 1
          if (-not $elf -or -not $app) { throw 'WIP build outputs not found' }
          python firmware-wip/tools/verify_image.py --elf $elf.FullName --bin $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'WIP verify_image.py failed' }

      - name: Stage images and check the tested hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $images = @(
            @{ Name = 'rhythm1000.bin';     Dir = 'firmware';     Want = '00d11f9e682c7fdb7e52896db66b5170ae881a1fafe4e79638d10282ce262171' },
            @{ Name = 'rhythm1015-wip.bin'; Dir = 'firmware-wip'; Want = '12cdd4689595dc94d68546fe74d279be9c84b1028b8e45afcaaa9fd8bead11a3' }
          )
          foreach ($image in $images) {
            $app = Get-ChildItem "$($image.Dir)/build/*_app.bin" | Select-Object -First 1
            if (-not $app) { throw "Build output not found for $($image.Name)" }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $app.FullName).Hash.ToLowerInvariant()
            if ($hash -ne $image.Want) { throw "Built $($image.Name) SHA-256 $hash does not match the tested image $($image.Want)" }
            Copy-Item $app.FullName $image.Name
            "$hash  $($image.Name)" | Out-File -Encoding ascii "$($image.Name).sha256"
          }

      - name: Build flasher package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'H420X-Flasher'
          New-Item -ItemType Directory -Force -Path $stage, "$stage\firmware", "$stage\gigadevice" | Out-Null
          Copy-Item -Path flash.bat, flash.ps1, get-firmware.bat, get-firmware.ps1, LICENSE, NOTICE.md -Destination $stage
          Copy-Item -Path rhythm1000.bin -Destination (Join-Path $stage 'firmware\rhythm1000.bin')
          Copy-Item -Path rhythm1015-wip.bin -Destination (Join-Path $stage 'firmware\rhythm1015-wip.bin')
          Copy-Item -Path .github/release/README.txt -Destination (Join-Path $stage 'README.txt')
          Copy-Item -Path .github/release/gigadevice-readme.txt -Destination (Join-Path $stage 'gigadevice\README.txt')

          $ref = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA }
          @(
            'Source code for these builds:',
            "https://github.com/WillDevE/h420xfirmware/tree/$ref/firmware",
            "https://github.com/WillDevE/h420xfirmware/tree/$ref/firmware-wip",
            '',
            'Those trees are the exact sources used by the GitHub Actions workflow',
            '(firmware = stable rhythm1000.bin, firmware-wip = WIP rhythm1015-wip.bin).',
            'The release page also has auto-generated source code zip/tar.gz files.',
            '',
            'License: GPL-3.0-or-later (see LICENSE). TinyUSB: MIT (see NOTICE.md).'
          ) | Out-File -Encoding ascii (Join-Path $stage 'SOURCE.txt')

          $pairs = @(
            @('firmware\rhythm1000.bin', 'rhythm1000.bin'),
            @('firmware\rhythm1015-wip.bin', 'rhythm1015-wip.bin'),
            @('flash.ps1', 'flash.ps1'),
            @('flash.bat', 'flash.bat'),
            @('get-firmware.ps1', 'get-firmware.ps1'),
            @('get-firmware.bat', 'get-firmware.bat'),
            @('README.txt', 'README.txt'),
            @('SOURCE.txt', 'SOURCE.txt'),
            @('LICENSE', 'LICENSE'),
            @('NOTICE.md', 'NOTICE.md'),
            @('gigadevice\README.txt', 'gigadevice/README.txt')
          )
          $sums = foreach ($pair in $pairs) {
            $fileHash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $stage $pair[0])).Hash.ToLowerInvariant()
            "$fileHash  $($pair[1])"
          }
          $sums | Out-File -Encoding ascii (Join-Path $stage 'SHA256SUMS.txt')

          Compress-Archive -Path $stage -DestinationPath 'H420X-Flasher.zip' -Force
          $versioned = "H420X-Flasher-$($env:GITHUB_REF_NAME).zip"
          Copy-Item -Path 'H420X-Flasher.zip' -Destination $versioned -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path 'H420X-Flasher.zip').Hash.ToLowerInvariant()
          "$zipHash  H420X-Flasher.zip" | Out-File -Encoding ascii 'H420X-Flasher.zip.sha256'
          "$zipHash  $versioned" | Out-File -Encoding ascii "$versioned.sha256"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'H420X-Flasher.zip'))
          $zip.Entries | Select-Object -ExpandProperty FullName
          $zip.Dispose()
          Write-Host "ZIP SHA-256: $zipHash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: |
            rhythm1000.bin
            rhythm1000.bin.sha256
            rhythm1015-wip.bin
            rhythm1015-wip.bin.sha256
            H420X-Flasher.zip
            H420X-Flasher-*.zip
            H420X-Flasher*.sha256

      - name: Publish release asset (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "Normal users: download H420X-Flasher.zip - it contains the flasher and two cursor-only images. The flasher labels image 1 (rhythm1000.bin) as the stable, recommended release and image 2 (rhythm1015-wip.bin) as WIP: higher report rate and lower overall scatter, but about 0.6% of host polls land at 2 ms (scattered drops, no long bursts). Advanced: both standalone images and their SHA-256 files are attached. Both images are built from the source in this repository by GitHub Actions; see README.md for the comparison, install and verification instructions."
          gh release create $tag H420X-Flasher.zip --verify-tag --title "H420X clean-room firmware $tag" --notes $notes 2>$null
          gh release upload $tag H420X-Flasher.zip "H420X-Flasher-$tag.zip" H420X-Flasher.zip.sha256 "H420X-Flasher-$tag.zip.sha256" rhythm1000.bin rhythm1000.bin.sha256 rhythm1015-wip.bin rhythm1015-wip.bin.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          gh release edit $tag --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
